# dbt project configuration (`level_source` folder and schema layout).
#
# Models are organized layer-first, then source-second:
#   models/staging/wtt, models/staging/ittf
#   models/intermediate
#   models/marts/wtt, models/marts/ittf, models/marts/core
#
# Heavy WTT JSONB staging models stay materialized as tables.

name: "tt_stats"
version: "1.0.0"
config-version: 2

profile: "tt_stats"

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

models:
  tt_stats:
    staging:
      wtt:
        +schema: staging_wtt
        +materialized: table
      ittf:
        +schema: staging_ittf
        +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      wtt:
        +schema: marts_wtt
        +materialized: table
      ittf:
        +schema: marts_ittf
        +materialized: view
      core:
        +schema: marts
        +materialized: view

seeds:
  tt_stats:
    +schema: seeds
    event_sponsors_manual:
      +column_types:
        event_id: integer
        ball_sponsor: varchar
        table_sponsor: varchar
        start_date: date
        event_name: varchar
        table_sponsor_source: varchar
    sponsor_domains:
      +column_types:
        domain: varchar
        sponsor_name: varchar
    round_codes:
      +column_types:
        raw_round_token: varchar
        round_code: varchar
        round_name: varchar
        round_stage: varchar
        round_order: smallint
    result_types:
      +column_types:
        result_code: varchar
        result_type: varchar
        is_default_result: boolean
        is_rating_eligible: boolean
        description: varchar
    match_format_overrides:
      +column_types:
        override_id: varchar
        event_id: integer
        discipline: varchar
        is_team_rubber: boolean
        round_code: varchar
        document_code: varchar
        match_format: varchar
        best_of: integer
        scheduled_games: integer
        scoring_rule: varchar
        notes: varchar
    match_score_overrides:
      +column_types:
        event_id: integer
        document_code: varchar
        overall_scores: varchar
        results_game_scores: varchar
        notes: varchar
