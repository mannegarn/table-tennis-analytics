version: 2

sources:
  - name: ingest
    schema: ingest
    description: Raw and operationally unpacked tables populated by the ingestion pipeline.
    tables:
      - name: ittf_player_profiles
        description: Player style, grip, and hand enrichment per player_id from ITTF master CSV or HTML.
      - name: event_sponsors_unpacked
        description: One row per sponsor per event, unpacked from ingest.event_sponsors_raw.
      - name: player_details_unpacked
        description: One flat WTT profile row per player_id, unpacked from ingest.player_details_raw.
      - name: match_commentary_unpacked
        description: One row per commentary action inside a match, unpacked from ingest.match_commentary_raw.
