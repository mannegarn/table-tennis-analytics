version: 2

models:
  - name: wtt__dim_events
    description: >
      Deduplicated WTT events dimension (1 row per WTT event_id, keeping the
      latest source_year), enriched with equipment sponsors and downstream data
      coverage flags.
    columns:
      - name: event_sk
        description: Deterministic 60-bit surrogate key hashed from 'wtt' and source_event_id.
        data_tests:
          - unique
          - not_null
      - name: source_system
        description: Source system identifier ('wtt').
        data_tests:
          - not_null
      - name: source_event_id
        description: Natural WTT event identifier.
        data_tests:
          - not_null
      - name: event_name
        description: Whitespace-normalized event name.
        data_tests:
          - not_null
      - name: event_type
        description: WTT event category label (e.g. WTTC, WTT Star Contender).
        data_tests:
          - not_null
      - name: event_tier_name
        description: Modern WTT event tier label (nullable for historical events).
      - name: event_year
        description: Calendar year derived from start_date.
        data_tests:
          - not_null
      - name: start_date
        description: Scheduled event start date.
        data_tests:
          - not_null
      - name: end_date
        description: Scheduled event end date.
        data_tests:
          - not_null
      - name: duration_days
        description: Inclusive event duration in days (end_date - start_date + 1); NULL when start_date > end_date.
      - name: country
        description: Whitespace-normalized host country name.
        data_tests:
          - not_null
      - name: city
        description: Whitespace-normalized host city name (nullable).
      - name: continent_code
        description: Host continent slug (europe, asia, americas, africa, oceania).
        data_tests:
          - not_null
      - name: ball_sponsor
        description: Canonical official ball brand from int_event_equipment_sponsors (nullable).
      - name: table_sponsor
        description: Canonical official table brand from int_event_equipment_sponsors (nullable).
      - name: has_matches
        description: True when at least one match entry exists for the event in stg_match_entries.
        data_tests:
          - not_null
      - name: has_match_details
        description: True when at least one non-empty match detail payload exists for the event in stg_match_details.
        data_tests:
          - not_null
      - name: has_commentary
        description: True when at least one commentary action exists for the event in stg_match_commentary.
        data_tests:
          - not_null
      - name: has_sponsors
        description: True when ball_sponsor or table_sponsor is present.
        data_tests:
          - not_null

  - name: wtt__dim_players
    description: >
      WTT players dimension (1 row per WTT/ITTF player_id), keyed by
      deterministic 60-bit player_sk and enriched with ITTF playing style, hand,
      and grip (preferring normalized WTT hand/grip when present). Also includes
      minimal fallback stub rows (has_wtt_profile = false) for any non-team
      player seen in match details or team rubbers whose WTT GetPlayers payload
      was empty.
    columns:
      - name: player_sk
        description: Deterministic 60-bit surrogate key hashed from 'ittf' and ittf_id.
        data_tests:
          - unique
          - not_null
      - name: ittf_id
        description: Natural ITTF/WTT player identifier stored as text (nullable in future unified marts).
        data_tests:
          - unique
          - not_null
      - name: player_name
        description: Full player display name from WTT (or match payload fallback for stub rows).
        data_tests:
          - not_null
      - name: player_given_name
        description: Player given name from WTT (NULL for stub rows without a WTT profile).
        data_tests:
          - not_null:
              config:
                where: "has_wtt_profile"
      - name: player_family_name
        description: Player family name from WTT (NULL for stub rows without a WTT profile).
        data_tests:
          - not_null:
              config:
                where: "has_wtt_profile"
      - name: country_code
        description: Three-letter country/nationality code from WTT (or match organization fallback for stub rows).
        data_tests:
          - not_null:
              config:
                where: "has_wtt_profile"
      - name: country_name
        description: Country/nationality display name from WTT (NULL for stub rows without a WTT profile).
        data_tests:
          - not_null:
              config:
                where: "has_wtt_profile"
      - name: organization_code
        description: Three-letter represented member association code.
        data_tests:
          - not_null:
              config:
                where: "has_wtt_profile"
      - name: organization_name
        description: Member association display name from WTT (NULL for stub rows without a WTT profile).
        data_tests:
          - not_null:
              config:
                where: "has_wtt_profile"
      - name: dob
        description: Player date of birth from WTT (NULL for stub rows without a WTT profile).
        data_tests:
          - not_null:
              config:
                where: "has_wtt_profile"
      - name: gender
        description: Player gender (M or F; inferred from match gender_category for stub rows).
        data_tests:
          - not_null:
              config:
                where: "has_wtt_profile"
          - accepted_values:
              arguments:
                values: ["M", "F"]
      - name: hand
        description: Playing hand (Left, Right, or NULL), preferring player_profile_overrides, then normalized WTT, then ITTF.
        data_tests:
          - accepted_values:
              arguments:
                values: ["Left", "Right"]
      - name: grip
        description: Playing grip (Shakehand, Penhold, or NULL), preferring player_profile_overrides, then normalized WTT, then ITTF.
        data_tests:
          - accepted_values:
              arguments:
                values: ["Shakehand", "Penhold"]
      - name: style
        description: Playing style (Attacker, Defender, or NULL), preferring player_profile_overrides over ITTF profile.
        data_tests:
          - accepted_values:
              arguments:
                values: ["Attacker", "Defender"]
      - name: head_shot
        description: Player headshot image URL/filename from WTT (nullable).
      - name: has_wtt_profile
        description: True when sourced from WTT GetPlayers profile data; false for minimal match-derived stub rows.
        data_tests:
          - not_null

  - name: wtt__fct_match_commentary
    description: >
      Fact table of match commentary actions at grain (event_id, document_code,
      sequence_number), keyed by deterministic 60-bit match_sk (FK ->
      wtt__dim_matches) and enriched with human-readable action_name and
      action_category from the action_types seed.
    columns:
      - name: match_sk
        description: Deterministic 60-bit surrogate key matching wtt__dim_matches.match_sk.
        data_tests:
          - not_null
      - name: event_id
        description: WTT event identifier.
        data_tests:
          - not_null
      - name: document_code
        description: WTT match document code within the event.
        data_tests:
          - not_null
      - name: sequence_number
        description: Action sequence number within the match.
        data_tests:
          - not_null
      - name: commentary_id
        description: UUID of the commentary action.
        data_tests:
          - not_null
      - name: action_type
        description: Raw WTT action code (e.g. STP, PT, SSR, YC).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('action_types')
                field: action_type
      - name: action_name
        description: Human-readable action label from dbt/seeds/action_types.csv.
        data_tests:
          - not_null
      - name: action_category
        description: High-level action grouping (scoring, service, match_flow, discipline, other).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["scoring", "service", "match_flow", "discipline", "other"]
      - name: commentary_text
        description: Human-readable commentary text (nullable for 350 MPOINT rows; placeholder text for silent actions).
      - name: has_commentary_text
        description: True when commentary_text is present and not the default placeholder string.
        data_tests:
          - not_null
      - name: utc_time
        description: UTC time of action (9-digit HHMMSSmmm for match actions; 13-digit epoch ms for OT rows).
        data_tests:
          - not_null

  - name: wtt__dim_matches
    description: >
      Master WTT match dimension combining all match entries (standalone matches
      and parent team ties) with unpacked individual team rubbers, keyed by
      deterministic 60-bit match_sk. Includes youth, Para, doubles, LIVE, and
      detail-less entries so every commentary action and downstream fact row
      resolves to dim_matches.
    columns:
      - name: match_sk
        description: Deterministic 60-bit surrogate key hashed from 'wtt', source_event_id, and document_code.
        data_tests:
          - unique
          - not_null
      - name: event_sk
        description: Foreign key to wtt__dim_events.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('wtt__dim_events')
                field: event_sk
      - name: source_system
        description: Source system identifier ('wtt').
        data_tests:
          - not_null
      - name: source_event_id
        description: Natural WTT event identifier.
        data_tests:
          - not_null
      - name: document_code
        description: Natural WTT match or team-rubber document code within the event.
        data_tests:
          - not_null
      - name: parent_document_code
        description: Parent team-tie document_code when is_team_rubber is true (nullable).
      - name: rubber_number
        description: 1-based rubber slot within a team tie when is_team_rubber is true (nullable).
      - name: source_match_id
        description: Upstream numeric WTT match ID from match entries (NULL for unpacked team rubbers).
      - name: discipline
        description: Normalized match discipline (singles, doubles, mixed_doubles, team).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["singles", "doubles", "mixed_doubles", "team"]
      - name: is_team_rubber
        description: True for individual rubbers unpacked from team ties; false for match-entry rows.
        data_tests:
          - not_null
      - name: gender_category
        description: Normalized gender category (men, women, mixed; NULL on 99 Mixed Team WC doubles rubbers).
        data_tests:
          - accepted_values:
              arguments:
                values: ["men", "women", "mixed"]
      - name: sub_event_type
        description: Sub-event category label (inherited from parent tie for team rubbers).
        data_tests:
          - not_null
      - name: sub_event_name
        description: Sub-event title from match details or team rubbers (nullable when detail-less).
      - name: sub_event_description
        description: Round and match description from match details or team rubbers (nullable).
      - name: age_category
        description: Age bracket (senior or U11..U21).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["senior", "U11", "U13", "U15", "U17", "U19", "U21"]
      - name: is_youth
        description: True when age_category is a youth bracket (U11..U21).
        data_tests:
          - not_null
      - name: is_para
        description: True when para_class is present or the event is a Para open/showcase event.
        data_tests:
          - not_null
      - name: para_class
        description: Para classification code from document_code when present (nullable).
      - name: raw_round_token
        description: Reconciled 4-character round token mapped to seeds.round_codes.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('round_codes')
                field: raw_round_token
      - name: round_code
        description: Canonical round code from seeds.round_codes.
        data_tests:
          - not_null
      - name: round_name
        description: Human-readable round name from seeds.round_codes.
        data_tests:
          - not_null
      - name: round_stage
        description: Broad tournament stage from seeds.round_codes.
        data_tests:
          - not_null
      - name: round_order
        description: Numeric sort order reflecting tournament progression.
        data_tests:
          - not_null
      - name: group_number
        description: Group number parsed from GP## round tokens (nullable).
      - name: match_number_in_round
        description: Numeric match ordinal parsed from document_code.
        data_tests:
          - not_null
      - name: start_date_utc
        description: Match start timestamp in UTC (nullable).
      - name: start_date_local
        description: Local match start timestamp without timezone (nullable).
      - name: venue_name
        description: Match venue name (nullable).
      - name: table_name
        description: Table name label (nullable).
      - name: table_number
        description: Alphanumeric table number/code (nullable).
      - name: duration
        description: Raw match duration string (mixed HH:MM:SS / H:MM / 00:00:00, nullable).
      - name: ttr_review
        description: Whether Table Tennis Review (TTR) was enabled (nullable).
      - name: max_challenges_per_competitor
        description: Configured TTR challenges allowed per competitor (99 = TTR disabled sentinel, nullable).
      - name: result_status
        description: Match result status (OFFICIAL or LIVE).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["OFFICIAL", "LIVE"]
      - name: is_live
        description: True when result_status = 'LIVE'.
        data_tests:
          - not_null
      - name: has_match_details
        description: True when match-details or rubber payload data exists.
        data_tests:
          - not_null
      - name: has_commentary
        description: True when at least one commentary row exists for this match.
        data_tests:
          - not_null

  - name: wtt__fct_senior_singles_matches
    description: >
      Primary senior able-bodied WTT singles match fact table (1 row per match_sk),
      combining standalone OFFICIAL singles matches and played/defaulted team-tie
      singles rubbers (excluding youth, Para, doubles, LIVE, unplayed dead rubbers,
      BYEs, and Event 2615 R4/R5 corrupted rubbers). Joins dim_players for canonical
      player names and uses match-time represented association for p1/p2_country_code.
    columns:
      - name: match_sk
        description: Primary key and foreign key to wtt__dim_matches.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('wtt__dim_matches')
                field: match_sk
      - name: event_sk
        description: Foreign key to wtt__dim_events.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('wtt__dim_events')
                field: event_sk
      - name: source_system
        description: Source system identifier ('wtt').
        data_tests:
          - not_null
      - name: source_event_id
        description: Natural WTT event identifier.
        data_tests:
          - not_null
      - name: document_code
        description: Natural WTT match or team-rubber document code within the event.
        data_tests:
          - not_null
      - name: is_team_rubber
        description: True for individual singles rubbers inside team ties; false for standalone singles.
        data_tests:
          - not_null
      - name: parent_document_code
        description: Parent team-tie document_code when is_team_rubber is true (nullable).
      - name: rubber_number
        description: 1-based rubber slot within a team tie when is_team_rubber is true (nullable).
      - name: p1_player_sk
        description: Foreign key to wtt__dim_players for competitor 1.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('wtt__dim_players')
                field: player_sk
      - name: p1_player_id
        description: Competitor 1 natural ITTF/WTT player ID.
        data_tests:
          - not_null
      - name: p1_player_name
        description: Canonical full name of competitor 1 from wtt__dim_players.
        data_tests:
          - not_null
      - name: p1_country_code
        description: Represented member association code for competitor 1 (match-time org with dim_players.organization_code fallback; not birth nationality).
        data_tests:
          - not_null
      - name: p2_player_sk
        description: Foreign key to wtt__dim_players for competitor 2.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('wtt__dim_players')
                field: player_sk
      - name: p2_player_id
        description: Competitor 2 natural ITTF/WTT player ID.
        data_tests:
          - not_null
      - name: p2_player_name
        description: Canonical full name of competitor 2 from wtt__dim_players.
        data_tests:
          - not_null
      - name: p2_country_code
        description: Represented member association code for competitor 2 (match-time org with dim_players.organization_code fallback; not birth nationality).
        data_tests:
          - not_null
      - name: winner_side
        description: Winning side (1 or 2; NULL for draws, no_score, or 0-0 double walkovers).
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2]
                quote: false
      - name: winner_player_sk
        description: Foreign key to wtt__dim_players for match winner (NULL on draws / 0-0 WO).
        data_tests:
          - relationships:
              arguments:
                to: ref('wtt__dim_players')
                field: player_sk
      - name: winner_player_id
        description: Natural ITTF/WTT player ID of match winner (nullable).
      - name: winner_player_name
        description: Canonical full name of match winner (nullable).
      - name: loser_player_sk
        description: Foreign key to wtt__dim_players for match loser (NULL on draws / 0-0 WO).
        data_tests:
          - relationships:
              arguments:
                to: ref('wtt__dim_players')
                field: player_sk
      - name: loser_player_id
        description: Natural ITTF/WTT player ID of match loser (nullable).
      - name: loser_player_name
        description: Canonical full name of match loser (nullable).
      - name: defaulting_side
        description: Defaulting side (1 or 2) when is_default_result is true and winner_side is known (nullable).
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2]
                quote: false
      - name: defaulting_player_sk
        description: Foreign key to wtt__dim_players for defaulting player (nullable).
        data_tests:
          - relationships:
              arguments:
                to: ref('wtt__dim_players')
                field: player_sk
      - name: defaulting_player_id
        description: Natural ITTF/WTT player ID of defaulting player (nullable).
      - name: defaulting_player_name
        description: Canonical full name of defaulting player (nullable).
      - name: gender_category
        description: Match gender category (men or women).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["men", "women"]
      - name: round_code
        description: Canonical round code from seeds.round_codes.
        data_tests:
          - not_null
      - name: round_stage
        description: Broad tournament stage from seeds.round_codes.
        data_tests:
          - not_null
      - name: round_order
        description: Numeric tournament progression order.
        data_tests:
          - not_null
      - name: start_date_utc
        description: Match start timestamp in UTC (nullable).
      - name: start_date_local
        description: Local match start timestamp without timezone (nullable).
      - name: match_format
        description: Canonical match format (best_of_3, best_of_5, best_of_7, fixed_3_games, fixed_4_games).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["best_of_3", "best_of_5", "best_of_7", "fixed_3_games", "fixed_4_games"]
      - name: best_of
        description: Best-of game count (NULL for fixed-game formats).
      - name: scheduled_games
        description: Fixed number of games for non-best-of formats (NULL for best-of formats).
      - name: scoring_rule
        description: Match winner scoring rule (games_won or points_won).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["games_won", "points_won"]
      - name: max_points_per_game
        description: Configured target points per game (nullable).
      - name: advantage_per_game
        description: Configured minimum winning point margin per game (nullable).
      - name: sudden_death_point
        description: Configured sudden-death tie point (99 = none; nullable).
      - name: result_type
        description: Canonical match outcome classification from seeds.result_types.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('result_types')
                field: result_type
      - name: is_default_result
        description: True when match ended by walkover, injury, retirement, disqualification, or DNS.
        data_tests:
          - not_null
      - name: is_rating_eligible
        description: True when eligible for rating models (played or draw with no score anomaly).
        data_tests:
          - not_null
      - name: has_result
        description: True when result_type is not no_score.
        data_tests:
          - not_null
      - name: has_score_anomaly
        description: True when a played/drawn match has an overall-vs-game or format mismatch.
        data_tests:
          - not_null
      - name: has_invalid_game_score
        description: True when at least one game row fails table-tennis scoring rules.
        data_tests:
          - not_null
      - name: overall_score_raw
        description: Raw (or overridden) overall score string.
      - name: games_won_p1
        description: Games won by player 1 for played/draw matches (NULL for defaults/no_score).
      - name: games_won_p2
        description: Games won by player 2 for played/draw matches (NULL for defaults/no_score).
      - name: points_won_p1
        description: Total points won by player 1 summed across played games (NULL for defaults/no_score).
      - name: points_won_p2
        description: Total points won by player 2 summed across played games (NULL for defaults/no_score).
      - name: p1_timeout
        description: Competitor 1 timeout flag (1 = taken, 0 = not taken, nullable).
      - name: p2_timeout
        description: Competitor 2 timeout flag (1 = taken, 0 = not taken, nullable).
      - name: p1_card_y
        description: Competitor 1 yellow cards (nullable).
      - name: p2_card_y
        description: Competitor 2 yellow cards (nullable).
      - name: p1_card_yr1
        description: Competitor 1 first yellow-red cards (nullable).
      - name: p2_card_yr1
        description: Competitor 2 first yellow-red cards (nullable).
      - name: p1_card_yr2
        description: Competitor 1 second yellow-red cards (nullable).
      - name: p2_card_yr2
        description: Competitor 2 second yellow-red cards (nullable).

  - name: wtt__fct_senior_singles_games
    description: >
      Per-game fact table for played and drawn matches in
      wtt__fct_senior_singles_matches, at grain (match_sk, game_number).
    columns:
      - name: match_sk
        description: Foreign key to wtt__fct_senior_singles_matches.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('wtt__fct_senior_singles_matches')
                field: match_sk
      - name: game_number
        description: 1-based game number within the match (1..7).
        data_tests:
          - not_null
      - name: p1_points
        description: Points scored by competitor 1 in this game.
        data_tests:
          - not_null
      - name: p2_points
        description: Points scored by competitor 2 in this game.
        data_tests:
          - not_null
      - name: point_margin
        description: Unsigned absolute point margin abs(p1_points - p2_points).
        data_tests:
          - not_null
      - name: winner_side
        description: Winning side for this game (1 or 2; NULL if tied on an anomalous score).
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2]
                quote: false
      - name: is_valid_game_score
        description: True when the game obeys table-tennis scoring rules.
        data_tests:
          - not_null
