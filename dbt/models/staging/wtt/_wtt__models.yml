version: 2

models:
  - name: stg_events
    description: >
      Unpacked event calendar rows from ingest_wtt.events_by_year_raw (1 row per
      source_year, event_id; deduplicates intra-year repeats and drops UI/CMS noise).
    columns:
      - name: source_year
        description: Calendar year whose WTT payload listed this event.
        data_tests:
          - not_null
      - name: event_id
        description: WTT event identifier.
        data_tests:
          - not_null
      - name: event_name
        description: Event name as sent by WTT.
        data_tests:
          - not_null
      - name: event_code
        description: Optional WTT event code.
      - name: event_type_id
        description: WTT event category identifier.
        data_tests:
          - not_null
      - name: event_type
        description: WTT event category label (e.g. WTTC, WTT Star Contender).
        data_tests:
          - not_null
      - name: event_tier_name
        description: Modern WTT event tier label (nullable for historical events).
      - name: start_date
        description: Scheduled start date (no timezone upstream).
        data_tests:
          - not_null
      - name: end_date
        description: Scheduled end date (no timezone upstream).
        data_tests:
          - not_null
      - name: country
        description: Host country name.
        data_tests:
          - not_null
      - name: city
        description: Host city name (nullable).
      - name: continent_code
        description: Host continent slug.
        data_tests:
          - not_null
      - name: subcontinent
        description: Host subcontinent label.
        data_tests:
          - not_null

  - name: stg_event_sponsors
    description: >
      Unpacked sponsor rows from ingest_wtt.event_sponsors_raw (1 row per event_id,
      event_sponsor_id), trimming blank strings to NULL.
    columns:
      - name: event_id
        description: WTT event identifier.
        data_tests:
          - not_null
      - name: event_sponsor_id
        description: WTT sponsor entry identifier within the event.
        data_tests:
          - not_null
      - name: sponsor_type_id
        description: WTT sponsor category identifier.
        data_tests:
          - not_null
      - name: sponsor_type_name
        description: WTT sponsor category label (e.g. Official Ball, Official Table).
        data_tests:
          - not_null
      - name: logo
        description: Relative logo path from WTT.
        data_tests:
          - not_null
      - name: dark_logo
        description: Relative dark-mode logo path from WTT (nullable).
      - name: sponsor_link
        description: Sponsor URL from WTT (nullable).

  - name: stg_match_entries
    description: >
      Unpacked match entries table from ingest_wtt.match_entries_payloads_raw (1 row per
      event_id, document_code). Drops 0%-filled enrichment slots (extended_info,
      match_card, messagePayload) and converts blank/'0001-01-01T00:00:00' dates to NULL.
    columns:
      - name: event_id
        description: WTT event identifier.
        data_tests:
          - not_null
      - name: document_code
        description: WTT match document code within the event.
        data_tests:
          - not_null
      - name: match_id
        description: Upstream match id (handles both 'id' and 'iD' spellings; not unique per ADR 0010).
        data_tests:
          - not_null
      - name: sub_event_type
        description: Sub-event category label (e.g. Men Singles, Women Doubles).
        data_tests:
          - not_null
      - name: full_results
        description: Upstream result status label (e.g. OFFICIAL).
        data_tests:
          - not_null
      - name: start_date_local
        description: Local match start timestamp (nullable; '0001-01-01T00:00:00' sentinel mapped to NULL).

  - name: stg_match_details
    description: >
      Unpacked match details table from ingest_wtt.match_details_raw (1 row per non-empty
      event_id, document_code). Extracts match metadata, game/overall scores, and
      competitor 1/2 attributes + player IDs while excluding the raw full_msg blob.
    columns:
      - name: event_id
        description: WTT event identifier.
        data_tests:
          - not_null
      - name: document_code
        description: WTT match document code within the event.
        data_tests:
          - not_null
      - name: result_status
        description: Match result status (e.g. OFFICIAL).
      - name: overall_scores
        description: Match score in games/sets (e.g. 3-0).
      - name: results_game_scores
        description: Comma-separated per-game scores (e.g. 11-7,11-4,11-9,0-0,0-0).

  - name: stg_team_match_rubbers
    description: >
      Unpacked individual team rubbers from ingest_wtt.match_details_raw
      teamParentData.extended_info.matches (1 row per event_id, document_code
      where match_result is present). Coalesces camelCase and PascalCase keys
      and classifies rubber_number, team_category, discipline, age_category,
      and raw_round_token.
    columns:
      - name: event_id
        description: WTT event identifier.
        data_tests:
          - not_null
      - name: document_code
        description: Canonical 42-char WTT rubber document code within the event.
        data_tests:
          - not_null
      - name: parent_document_code
        description: Parent team tie document code in stg_match_details.
        data_tests:
          - not_null
      - name: rubber_number
        description: 1-based rubber position (1..5) parsed from characters 33..34 of document_code.
        data_tests:
          - not_null
      - name: team_match_no
        description: Upstream teamMatchNo ordinal when numeric (nullable).
      - name: team_category
        description: Team event category derived from document_code (men, women, mixed).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["men", "women", "mixed"]
      - name: gender_category
        description: >
          Per-rubber gender category (men, women, mixed). For Mixed Team World
          Cup rubbers, rubber 1 is mixed, rubber 2 is women's singles, rubber 3
          is men's singles, and rubbers 4-5 (team-choice doubles) are NULL until
          resolved via dim_players.gender in downstream marts.
        data_tests:
          - accepted_values:
              arguments:
                values: ["men", "women", "mixed"]
      - name: discipline
        description: Rubber discipline (singles, doubles, mixed_doubles).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["singles", "doubles", "mixed_doubles"]
      - name: age_category
        description: Age group parsed from document_code (senior or U11..U21).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["senior", "U11", "U13", "U15", "U17", "U19", "U21"]
      - name: is_youth
        description: True when age_category is a youth bracket (U11..U21).
        data_tests:
          - not_null
      - name: raw_round_token
        description: Normalized 4-character round token mapped to seeds.round_codes (GP## for groups, FNL2 for Olympic team bronze medal ties).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('round_codes')
                field: raw_round_token
      - name: sub_event_name
        description: Sub-event title from match_result (e.g. Men's Teams).
      - name: sub_event_description
        description: Round and rubber description from match_result.
      - name: venue_name
        description: Match venue name (nullable).
      - name: table_name
        description: Table name label (nullable).
      - name: table_number
        description: Table code/number (nullable).
      - name: duration
        description: Match duration string (HH:MM:SS, nullable).
      - name: start_date_utc
        description: Match start timestamp in UTC (nullable; 01/01/0001 sentinels mapped to NULL).
      - name: start_date_local
        description: Local match start timestamp without timezone (nullable; 01/01/0001 sentinels mapped to NULL).
      - name: best_of
        description: Upstream matchConfig.bestOfXGames (nullable; e.g. Tokyo 2020 omits it and Mixed Team WC uses fixed 3-game rubbers).
      - name: max_points_per_game
        description: Configured target points per game (usually 11; nullable).
      - name: advantage_per_game
        description: Configured minimum winning point margin per game (usually 2; nullable).
      - name: sudden_death_point
        description: Configured sudden-death point cap (usually 99 for none; nullable).
      - name: max_challenges_per_competitor
        description: Configured TTR challenges allowed per competitor (nullable).
      - name: ttr_review
        description: Whether Table Tennis Review (TTR) was enabled (nullable).
      - name: result_status
        description: Match result status (e.g. OFFICIAL).
        data_tests:
          - not_null
      - name: overall_scores
        description: Overall score in games/sets (e.g. 3-0, 3-0 WO, 2-1; nullable).
      - name: result_overall_scores
        description: Duplicate overall score string from upstream (nullable).
      - name: results_game_scores
        description: Comma-separated per-game scores (e.g. 11-7,11-4,11-9,0-0,0-0; nullable).
      - name: current_game_number
        description: Current or final game number (nullable).
      - name: comp_1_id
        description: Upstream competitor 1 identifier.
      - name: comp_1_name
        description: Upstream competitor 1 display name.
      - name: comp_1_org
        description: Upstream competitor 1 organization code.
      - name: comp_1_type
        description: Competitor 1 slot type (H or A).
      - name: comp_1_scores
        description: Comma-separated competitor 1 game scores (do not use for defaults; use results_game_scores).
      - name: comp_1_irm
        description: Competitor 1 injury/result marker (e.g. OK).
      - name: comp_1_timeout
        description: Competitor 1 timeout flag/count.
      - name: comp_1_medical_timeout
        description: Competitor 1 medical timeout flag/count.
      - name: comp_1_card_y
        description: Competitor 1 yellow cards.
      - name: comp_1_card_yr1
        description: Competitor 1 first yellow-red cards.
      - name: comp_1_card_yr2
        description: Competitor 1 second yellow-red cards.
      - name: comp_1_player_1_id
        description: Competitor 1 primary player ITTF/WTT ID.
        data_tests:
          - not_null
      - name: comp_1_player_1_name
        description: Competitor 1 primary player display name.
      - name: comp_1_player_1_org
        description: Competitor 1 primary player organization code.
      - name: comp_1_player_1_position
        description: Competitor 1 primary player position within pair/side.
      - name: comp_1_player_2_id
        description: Competitor 1 partner ITTF/WTT ID (NULL for singles).
      - name: comp_1_player_2_name
        description: Competitor 1 partner display name (NULL for singles).
      - name: comp_1_player_2_org
        description: Competitor 1 partner organization code (NULL for singles).
      - name: comp_1_player_2_position
        description: Competitor 1 partner position within pair (NULL for singles).
      - name: comp_2_id
        description: Upstream competitor 2 identifier.
      - name: comp_2_name
        description: Upstream competitor 2 display name.
      - name: comp_2_org
        description: Upstream competitor 2 organization code.
      - name: comp_2_type
        description: Competitor 2 slot type (H or A).
      - name: comp_2_scores
        description: Comma-separated competitor 2 game scores (do not use for defaults; use results_game_scores).
      - name: comp_2_irm
        description: Competitor 2 injury/result marker (e.g. OK).
      - name: comp_2_timeout
        description: Competitor 2 timeout flag/count.
      - name: comp_2_medical_timeout
        description: Competitor 2 medical timeout flag/count.
      - name: comp_2_card_y
        description: Competitor 2 yellow cards.
      - name: comp_2_card_yr1
        description: Competitor 2 first yellow-red cards.
      - name: comp_2_card_yr2
        description: Competitor 2 second yellow-red cards.
      - name: comp_2_player_1_id
        description: Competitor 2 primary player ITTF/WTT ID.
        data_tests:
          - not_null
      - name: comp_2_player_1_name
        description: Competitor 2 primary player display name.
      - name: comp_2_player_1_org
        description: Competitor 2 primary player organization code.
      - name: comp_2_player_1_position
        description: Competitor 2 primary player position within pair/side.
      - name: comp_2_player_2_id
        description: Competitor 2 partner ITTF/WTT ID (NULL for singles).
      - name: comp_2_player_2_name
        description: Competitor 2 partner display name (NULL for singles).
      - name: comp_2_player_2_org
        description: Competitor 2 partner organization code (NULL for singles).
      - name: comp_2_player_2_position
        description: Competitor 2 partner position within pair (NULL for singles).

  - name: stg_match_commentary
    description: >
      Unpacked match commentary table from ingest_wtt.match_commentary_raw (1 row per
      event_id, document_code, sequence_number). Keeps action identifiers, text, and
      millisecond-precision utc_time; drops utc_date, local_date/time, and source_ts.
    columns:
      - name: event_id
        description: WTT event identifier.
        data_tests:
          - not_null
      - name: document_code
        description: WTT match document code within the event.
        data_tests:
          - not_null
      - name: sequence_number
        description: Action sequence number within the match.
        data_tests:
          - not_null
      - name: commentary_id
        description: UUID of the commentary action.
      - name: action_type
        description: WTT action code (e.g. STP, PT, SSR, SSD, TO, YC).
      - name: commentary_text
        description: Human-readable commentary text.
      - name: utc_time
        description: UTC time of action in HHMMSSmmm (millisecond precision).

  - name: stg_wtt_players
    description: >
      Unpacked WTT player profile table from ingest_wtt.player_details_raw. Drops
      0%-filled fields and currently redundant columns (player_family_name_first,
      nationality_code/name, headshot_r/l), trims blank strings to NULL, and casts
      dob to date.
    columns:
      - name: player_id
        description: WTT/ITTF player identifier.
        data_tests:
          - not_null
          - unique
      - name: player_name
        description: Full display name (Given FAMILY).
        data_tests:
          - not_null
      - name: player_given_name
        description: Given name.
        data_tests:
          - not_null
      - name: player_family_name
        description: Family name.
        data_tests:
          - not_null
      - name: country_code
        description: Three-letter country/association code.
        data_tests:
          - not_null
      - name: country_name
        description: Country/association name.
        data_tests:
          - not_null
      - name: organization_code
        description: Organization code (differs from country_code for a small subset).
        data_tests:
          - not_null
      - name: organization_name
        description: Organization name.
        data_tests:
          - not_null
      - name: gender
        description: Player gender (M or F).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['M', 'F']
      - name: age
        description: Player age as reported by WTT at fetch time.
        data_tests:
          - not_null
      - name: dob
        description: Date of birth cast to date.
        data_tests:
          - not_null
      - name: handedness
        description: Raw trimmed handedness (normalized in players mart).
      - name: grip
        description: Raw trimmed grip (normalized in players mart).
      - name: head_shot
        description: Relative path/URL to player headshot image (nullable).
