version: 2

models:
  - name: stg_ittf_players
    description: >
      Thin staging view over ingest.ittf_player_profiles. Keeps player_id, hand,
      grip, and style, trimming blank strings to NULL.
    columns:
      - name: player_id
        description: ITTF/WTT player identifier.
        data_tests:
          - not_null
          - unique
      - name: hand
        description: Playing hand (Left, Right, or NULL).
        data_tests:
          - accepted_values:
              arguments:
                values: ['Left', 'Right']
      - name: grip
        description: Raw trimmed grip value (normalized in players mart).
        data_tests:
          - accepted_values:
              arguments:
                values: ['Shakehand', 'Penhold', 'Shake hand', 'Handshake']
      - name: style
        description: Playing style (Attacker, Defender, or NULL).
        data_tests:
          - accepted_values:
              arguments:
                values: ['Attacker', 'Defender']

  - name: stg_wtt_players
    description: >
      Thin staging view over ingest.player_details_unpacked. Drops 0%-filled fields,
      ingestion timestamps, and currently redundant columns (player_family_name_first,
      nationality_code/name, headshot_r/l). Trims blank strings to NULL and casts dob to date.
    columns:
      - name: player_id
        description: WTT/ITTF player identifier.
        data_tests:
          - not_null
          - unique
      - name: player_name
        description: Full display name (Given FAMILY).
        data_tests:
          - not_null
      - name: player_given_name
        description: Given name.
        data_tests:
          - not_null
      - name: player_family_name
        description: Family name.
        data_tests:
          - not_null
      - name: country_code
        description: Three-letter country/association code.
        data_tests:
          - not_null
      - name: country_name
        description: Country/association name.
        data_tests:
          - not_null
      - name: organization_code
        description: Organization code (differs from country_code for a small subset).
        data_tests:
          - not_null
      - name: organization_name
        description: Organization name.
        data_tests:
          - not_null
      - name: gender
        description: Player gender (M or F).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['M', 'F']
      - name: age
        description: Player age as reported by WTT at fetch time.
        data_tests:
          - not_null
      - name: dob
        description: Date of birth cast to date.
        data_tests:
          - not_null
      - name: handedness
        description: Raw trimmed handedness (normalized in players mart).
      - name: grip
        description: Raw trimmed grip (normalized in players mart).
      - name: head_shot
        description: Relative path/URL to player headshot image (nullable).
