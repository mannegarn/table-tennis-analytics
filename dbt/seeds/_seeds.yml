version: 2

seeds:
  - name: action_types
    description: >
      Lookup table mapping WTT match commentary action_type codes to
      human-readable action_name labels and broad action_category groupings.
    columns:
      - name: action_type
        description: Raw WTT action code from match commentary (e.g. STP, PT, SSR).
        data_tests:
          - not_null
          - unique
      - name: action_name
        description: Human-readable label for the action code.
        data_tests:
          - not_null
      - name: action_category
        description: High-level grouping (scoring, service, match_flow, discipline, other).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["scoring", "service", "match_flow", "discipline", "other"]

  - name: sponsor_domains
    description: >
      Normalized bare-domain lookup mapping equipment sponsor website domains
      to canonical brand names (derived from data/sponsor_links_map.json).
    columns:
      - name: domain
        description: Lowercase bare domain without protocol, www., path, or query string.
        data_tests:
          - not_null
          - unique
      - name: sponsor_name
        description: Canonical equipment brand name (e.g. DHS, Butterfly, Double Fish).
        data_tests:
          - not_null

  - name: event_sponsors_manual
    description: >
      User-maintained, YouTube-verified table and ball sponsor overrides per event.
      Takes precedence over automated sponsor_link extraction.
    columns:
      - name: event_id
        description: WTT event identifier.
        data_tests:
          - not_null
          - unique
      - name: ball_sponsor
        description: Verified official ball brand for the event (nullable).
      - name: table_sponsor
        description: Verified official table brand for the event (nullable).
      - name: start_date
        description: Scheduled event start date synced from marts_wtt.dim_events (nullable).
      - name: event_name
        description: Optional human-readable event name for reference while editing the CSV.
      - name: table_sponsor_source
        description: Optional provenance flag indicating how table_sponsor was populated (e.g. gemini_youtube when filled automatically).

  - name: player_identity_overrides
    description: >
      User-maintained manual cross-source player identity links. Points at
      target_ittf_id or (target_source_system, target_source_player_id), never
      at a pasted player_sk hash.
    columns:
      - name: source_system
        description: Source system of the player record to override (e.g. pro_a).
      - name: source_player_id
        description: Natural player identifier in source_system.
      - name: target_ittf_id
        description: Canonical ITTF player ID when linking to an ITTF-registered player (nullable).
      - name: target_source_system
        description: Target source system when linking two non-ITTF league players (nullable).
      - name: target_source_player_id
        description: Target natural player identifier in target_source_system (nullable).
      - name: notes
        description: Free-text rationale or verification notes for the override.

  - name: round_codes
    description: >
      Lookup table mapping raw 4-character WTT document_code round tokens (with
      GP## for groups and FNL2 for non-team bronze medal matches) to canonical
      round_code labels, human-readable round names, stages, and sort order.
    columns:
      - name: raw_round_token
        description: Normalized 4-character round token extracted from WTT document_code.
        data_tests:
          - not_null
          - unique
      - name: round_code
        description: Canonical round identifier.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - GROUP
                  - QUAL
                  - R128
                  - R64
                  - R32
                  - R16
                  - QF
                  - SF
                  - BRONZE
                  - F
                  - CONSOLATION
                  - PLACEMENT
      - name: round_name
        description: Human-readable round description.
        data_tests:
          - not_null
      - name: round_stage
        description: Broad tournament stage grouping.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["qualifying", "group", "knockout", "consolation", "placement"]
      - name: round_order
        description: Numeric sort order reflecting tournament progression.
        data_tests:
          - not_null

  - name: result_types
    description: >
      Lookup table mapping match outcome codes (PLAYED, DRAW, NO_SCORE, and WTT
      default suffixes WO/INJ/RET/DSQ/DNS) to canonical result_type, default
      status, and rating eligibility flags.
    columns:
      - name: result_code
        description: Raw outcome or suffix code (PLAYED, DRAW, WO, INJ, RET, DSQ, DNS, NO_SCORE).
        data_tests:
          - not_null
          - unique
      - name: result_type
        description: Canonical match result classification.
        data_tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values:
                  - played
                  - draw
                  - walkover
                  - injury
                  - retired
                  - disqualified
                  - did_not_start
                  - no_score
      - name: is_default_result
        description: True when the match ended by walkover, injury, retirement, disqualification, or DNS.
        data_tests:
          - not_null
      - name: is_rating_eligible
        description: True when the match result is eligible for rating models (e.g. Glicko-2).
        data_tests:
          - not_null
      - name: description
        description: Plain-English explanation of the result classification.
        data_tests:
          - not_null

  - name: match_format_overrides
    description: >
      Curated overrides for known upstream WTT matchConfig.bestOfXGames gaps or
      errors (e.g. Olympic best-of-7 formats and World Cup fixed-4-game groups).
      Matches either a specific (event_id, document_code) or a broader
      (event_id, discipline, round_code) scope when document_code is NULL.
    columns:
      - name: override_id
        description: Stable human-readable identifier for the override rule.
        data_tests:
          - not_null
          - unique
      - name: event_id
        description: WTT event identifier.
        data_tests:
          - not_null
      - name: discipline
        description: Normalized discipline filter (e.g. singles, doubles, mixed_doubles); nullable only for exact document_code overrides.
      - name: round_code
        description: Optional canonical round_code filter (e.g. GROUP); NULL applies to all rounds.
      - name: document_code
        description: Optional exact WTT document_code for single-match overrides.
      - name: match_format
        description: Canonical match format (e.g. best_of_5, best_of_7, fixed_3_games, fixed_4_games).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["best_of_3", "best_of_5", "best_of_7", "fixed_3_games", "fixed_4_games"]
      - name: best_of
        description: Corrected best-of game count (NULL for fixed-game formats such as fixed_4_games).
      - name: scheduled_games
        description: Fixed number of games played for non-best-of formats (e.g. 4 for World Cup groups).
      - name: scoring_rule
        description: Match winner scoring rule.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["games_won", "points_won"]
      - name: notes
        description: Verification rationale for the override.
        data_tests:
          - not_null
