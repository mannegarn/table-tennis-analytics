[project]
name = "tt-stats-analytics"
version = "0.1.0"
description = "End-to-end table tennis data platform: ingest, land, transform and analyse."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=1.0",
    "httpx>=0.27",
    "imageio-ffmpeg>=0.6.0",
    "nbformat>=4.2.0",
    "plotly>=5.24",
    "polars>=1.0",
    "psycopg[binary]>=3.2",
    "pyarrow>=18.0",
    "pydantic-settings>=2.6",
    "pytest-coverage>=0.0",
    "streamlit>=1.67",
    "tenacity>=9.0",
    "tqdm>=4.66",
    "yt-dlp>=2025.1.15",
]

[project.scripts]
tt-db-check = "tt_stats.core.db:main"
tt-db-migrate = "tt_stats.core.migrations:main"
tt-events-collect = "tt_stats.events.collect:main"
tt-events-unpack = "tt_stats.events.unpack:main"
tt-matches-collect = "tt_stats.matches.collect.match_entries:main"
tt-matches-unpack = "tt_stats.matches.land.unpack:main"
tt-match-details-collect = "tt_stats.matches.collect.match_details:main"
tt-match-details-seed = "tt_stats.matches.backup_seed:main"
tt-match-commentary-collect = "tt_stats.matches.collect.match_commentary:main"
tt-event-sponsors-collect = "tt_stats.event_sponsors.collect:main"
tt-event-sponsors-identify = "tt_stats.event_sponsors.video_identify:main"
tt-event-sponsors-sync = "tt_stats.event_sponsors.manual_sync:main"
tt-player-details-collect = "tt_stats.players.collect:main"
tt-ittf-players-seed = "tt_stats.players.ittf_seed:main"
tt-player-profile-overrides-sync = "tt_stats.players.profile_overrides_sync:main"
tt-update-summary = "tt_stats.summary:main"
tt-app-export = "tt_stats.analytics.export_app_data:main"
tt-glicko-build = "tt_stats.analytics.glicko2:main"

[dependency-groups]
dev = [
    "brotli>=1.2.1",
    "dbt-postgres>=1.9",
    "ipykernel>=7.0",
    "ipywidgets>=8.1",
    "jupyterlab>=4.3",
    "mypy>=1.13",
    "pandas>=2.2",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "sqlfluff>=3.4",
    "types-tqdm>=4.70.0.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tt_stats"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires a running PostgreSQL instance or the live WTT API",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific
    "PT",  # flake8-pytest-style
    "T20", # flake8-print: no print statements, use the logger
    "S",   # flake8-bandit: security checks (SQL built from strings, weak hashes, ...)
]

[tool.ruff.lint.per-file-ignores]
# pytest is built on bare asserts.
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["tt_stats"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["imageio_ffmpeg", "yt_dlp"]
ignore_missing_imports = true
