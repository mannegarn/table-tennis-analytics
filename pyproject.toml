[project]
name = "tt-stats-analytics"
version = "0.1.0"
description = "End-to-end table tennis data platform: ingest, land, transform and analyse."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "polars>=1.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "tenacity>=9.0",
    "tqdm>=4.66",
]

[project.scripts]
tt-db-check = "tt_stats.core.db:main"
tt-log-demo = "tt_stats.core.logging_demo:main"

[dependency-groups]
dev = [
    "dbt-postgres>=1.9",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tt_stats"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requires a running PostgreSQL instance",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific
    "PT",  # flake8-pytest-style
    "T20", # flake8-print: no print statements, use the logger
]

[tool.ruff.lint.isort]
known-first-party = ["tt_stats"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
